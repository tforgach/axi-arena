# Reference pack: axi-fetch vs Claude Code's built-in WebFetch.
name: axi-fetch
version: 0.3.0
axi_version_cmd: axi-fetch --version

# Installs a pinned axi-fetch into .tools/ (no global install).
setup: scripts/setup.sh

defaults:
  trials: 3
  models: [claude-sonnet-5-5]
  max_turns: 20
  timeout_s: 180
  effort: medium
  network: replay          # fixtures in fixtures/<task>/; refresh with `axi-arena record`

arms:
  axi:
    tools: [Bash]
    allow: ["Bash(axi-fetch:*)"]
    deny: ["Bash(axi-fetch update:*)"]   # self-update would change the AXI mid-run
    hooks: { SessionStart: hooks/usage.sh }   # ambient usage; a skill would cost a turn per task
    path: [.tools/node_modules/.bin]
  webfetch:                      # Claude Code's built-in fetch (summarizes pages on a side model)
    tools: [WebFetch]
    allow: [WebFetch]
  curl:                          # raw fetching, the way an agent without WebFetch reads pages
    tools: [Bash]
    allow: ["Bash(curl:*)", "Bash(grep:*)", "Bash(sed:*)", "Bash(head:*)", "Bash(tail:*)", "Bash(awk:*)", "Bash(cut:*)", "Bash(tr:*)", "Bash(wc:*)"]
    hooks: { SessionStart: hooks/curl-usage.sh }   # the same kind of one-line guidance the axi arm gets
