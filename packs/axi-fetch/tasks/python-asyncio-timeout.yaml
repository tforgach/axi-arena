id: python-asyncio-timeout
prompt: >
  Using https://docs.python.org/3/library/asyncio-task.html, in which Python version
  was asyncio.timeout() added, and what does the page say happens to the task when
  asyncio.wait_for() times out? Answer briefly.
tags: [train, docs, deep-content]
checks:
  - { type: regex, pattern: '3\.11', required: true }
  - { type: regex, pattern: 'cancel' }
  - { type: tool_called, min: 1 }
judge:
  rubric: >
    Correct if it says asyncio.timeout() was added in Python 3.11 and that wait_for
    cancels the task on timeout (raising TimeoutError).
  reference: Added in 3.11; on timeout wait_for cancels the task and raises TimeoutError.
