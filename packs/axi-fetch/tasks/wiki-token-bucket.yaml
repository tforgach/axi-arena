id: wiki-token-bucket
prompt: >
  According to https://en.wikipedia.org/wiki/Token_bucket, which other algorithm is
  the token bucket compared to, and how does the article describe the relationship
  between the two when that other algorithm is used as a meter? Answer in two short
  sentences.
tags: [article, single-fetch]
checks:
  - { type: contains, value: leaky bucket, required: true }
  - { type: tool_called, min: 1 }
judge:
  # Binary and explicit: a cheap judge applies this literally, so say what is NOT required.
  rubric: >
    Score 1.0 if the answer (a) names the leaky bucket algorithm and (b) says that, when
    the leaky bucket is used as a meter, the two are equivalent — any wording that conveys
    equivalence counts, e.g. "equivalent", "the same", "mirror image(s)", "identical in
    behavior". Do NOT deduct for omitting how packets are classified, for extra correct
    detail, or for phrasing. Score 0.5 if it names the leaky bucket but does not convey
    equivalence as a meter. Score 0 if it doesn't name the leaky bucket or states they differ.
  reference: >
    The leaky bucket. Used as a meter, it is equivalent to the token bucket (a mirror
    image of it).
